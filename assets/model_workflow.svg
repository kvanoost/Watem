<text x="310" y="413" text-anchor="middle" class="sub">Erosion and deposition · sediment delivery</text>
<text x="310" y="442" text-anchor="middle" class="body">Spatial redistribution, transport and sediment budgets</text>
<rect x="620" y="385" width="540" height="86" rx="10" fill="#f0f7fc" stroke="#6c9fca"/>
<text x="890" y="413" text-anchor="middle" class="sub">Local runoff · cumulative runoff · hydrographs</text>
