<text x="600" y="93" text-anchor="middle" class="sub">1 · Geographical inputs and spatial preprocessing</text>
<text x="600" y="121" text-anchor="middle" class="body">DEM · stream network · crop parcels · land cover · soil map · roads and buildings</text>
<text x="600" y="146" text-anchor="middle" class="small">Catchment delineation, common grid, parameter lookup, routing and outlet</text>
