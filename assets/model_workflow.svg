<rect x="40" y="512" width="1120" height="48" rx="10" fill="#17324d"/><text x="600" y="543" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="#fff" style="fill:#fff">NB01 · Frozen baseline → NB02 · Design and simulate interventions</text>
<path d="M600 560V578H220V594" class="arrow"/><path d="M600 578V594" class="arrow"/><path d="M600 578H980V594" class="arrow"/>
