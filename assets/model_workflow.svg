<rect x="40" y="211" width="540" height="144" rx="12" fill="#fff4ea" stroke="#c48a59"/>
<text x="310" y="239" text-anchor="middle" class="sub">2A · Soil erosion and sediment transport</text>
<text x="310" y="269" text-anchor="middle" class="body">Rainfall erosivity R · erodibility K · topography LS</text>
<text x="310" y="292" text-anchor="middle" class="body">Cover C · support practices P · transport kTC</text>
<text x="310" y="327" text-anchor="middle" class="small">RUSLE + sediment transport capacity + landscape routing</text>
<rect x="620" y="211" width="540" height="144" rx="12" fill="#edf6fc" stroke="#6c9fca"/>
<text x="890" y="239" text-anchor="middle" class="sub">2B · Runoff generation and routing</text>
<text x="890" y="269" text-anchor="middle" class="body">Storm rainfall · Curve Number · intensity correction</text>
<text x="890" y="292" text-anchor="middle" class="body">Antecedent rainfall · flow velocity · channel routing</text>
<text x="890" y="327" text-anchor="middle" class="small">Modified CN runoff + time-dependent routing</text>
<path d="M310 355V381" class="arrow"/><path d="M890 355V381" class="arrow"/>
