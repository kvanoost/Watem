<text x="600" y="626" text-anchor="middle" class="sub">Vegetated buffer strips</text>
<text x="600" y="653" text-anchor="middle" class="body">Field margins, contour grass strips</text>
<text x="600" y="677" text-anchor="middle" class="body">Riparian buffers · location and width</text>
<text x="600" y="705" text-anchor="middle" class="body" font-weight="bold">Fractional C, CN and kTC changes</text>
<text x="600" y="730" text-anchor="middle" class="small">Available; subgrid approximation</text>
