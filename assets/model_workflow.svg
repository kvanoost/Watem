<text x="600" y="820" text-anchor="middle" class="sub">NB03 · Compare baseline and scenarios: erosion, sediment delivery, runoff and peaks</text>
<text x="600" y="856" text-anchor="middle" class="small">Shared grid and routing; erosion and runoff are not dynamically coupled in this teaching implementation.</text>
