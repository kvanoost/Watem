<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="865" viewBox="0 0 1200 865">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324d} .heading{font-size:28px;font-weight:bold}.sub{font-size:19px;font-weight:bold}.body{font-size:16px}.small{font-size:14px}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="865" rx="18" fill="#fff"/>
