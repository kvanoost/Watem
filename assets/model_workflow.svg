<text x="218" y="653" text-anchor="middle" class="body">Cover crops, residues, reduced tillage</text>
<text x="218" y="677" text-anchor="middle" class="body">Improved infiltration and soil structure</text>
<text x="218" y="705" text-anchor="middle" class="body" font-weight="bold">C multiplier · CN change</text>
